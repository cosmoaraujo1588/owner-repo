<!doctype html>
<html lang="pt-BR">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sacolinha | Kairos Shopping</title>
  <meta name="description" content="Seus produtos salvos na sacolinha da Kairos Shopping. Finalize cada compra no checkout oficial do produto.">
  <link rel="icon" href="/assets/logo-kairos-oficial.png">
  <link rel="stylesheet" href="/premium-store.css?v=20260613-premium">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7f6;color:#17212b}
    .cart-top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dfe7e3}
    .cart-top div{width:min(1180px,calc(100% - 28px));margin:auto;min-height:72px;display:flex;align-items:center;gap:14px}
    .cart-top img{width:48px;height:48px;border-radius:50%;border:2px solid #087a55}.cart-top strong{font-size:1.1rem;color:#063f31}
    .cart-top a:last-child{margin-left:auto;padding:11px 16px;border-radius:6px;background:#087a55;color:#fff;font-weight:800;text-decoration:none}
    main{width:min(1180px,calc(100% - 28px));margin:32px auto 80px}.cart-heading{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}
    h1{margin:0;font-size:clamp(1.7rem,5vw,2.6rem)}.cart-heading p{margin:6px 0 0;color:#607080}.clear{border:1px solid #d7e1dd;background:#fff;border-radius:6px;padding:10px 14px;cursor:pointer;font-weight:800}
    .cart-list{display:grid;gap:14px}.cart-item{display:grid;grid-template-columns:130px 1fr auto;gap:18px;align-items:center;padding:16px;border:1px solid #dfe7e3;border-radius:8px;background:#fff;box-shadow:0 8px 24px rgba(20,58,45,.06)}
    .cart-item img{width:130px;aspect-ratio:1/1;object-fit:cover;border-radius:6px}.cart-item h2{margin:0 0 8px;font-size:1rem}.cart-item p{margin:4px 0;color:#607080;font-size:.85rem}.cart-item strong{color:#143a63;font-size:1.3rem}
    .cart-actions{min-width:180px;display:grid;gap:8px}.buy,.remove{min-height:42px;border-radius:6px;font-weight:850;cursor:pointer}.buy{border:0;background:#1769aa;color:#fff}.remove{border:1px solid #d7e1dd;background:#fff;color:#53635d}
    .cart-note,.empty{margin-top:20px;padding:20px;border:1px solid #dfe7e3;border-radius:8px;background:#fff}.empty{text-align:center;padding:50px 20px}.empty a{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:6px;background:#087a55;color:#fff;text-decoration:none;font-weight:850}
    @media(max-width:680px){.cart-heading{display:block}.clear{margin-top:12px}.cart-item{grid-template-columns:88px 1fr;gap:12px;padding:12px}.cart-item img{width:88px}.cart-actions{grid-column:1/-1;min-width:0;grid-template-columns:1fr 1fr}.cart-top strong{font-size:.9rem}.cart-top a:last-child{padding:9px 11px;font-size:.78rem}}
  </style>
</head>
<body>
  <header class="cart-top"><div><a href="/"><img src="/assets/logo-kairos-oficial.png" alt="Kairos Shopping"></a><strong>Kairos Shopping</strong><a href="/#produtos">Continuar comprando</a></div></header>
  <main>
    <div class="cart-heading"><div><h1>Minha sacolinha</h1><p>Escolha o item e finalize cada produto separadamente no checkout oficial.</p></div><button class="clear" id="clearCart" type="button">Limpar sacolinha</button></div>
    <section class="cart-list" id="cartList"></section>
    <aside class="cart-note"><strong>Compra segura e transparente</strong><p>Cada produto possui um checkout externo individual. Ao clicar em Comprar, voce sera direcionado para o checkout configurado para aquele item.</p></aside>
  </main>
  <script src="/carrinho.js?v=20260613-premium" defer></script>
</body>
</html>
